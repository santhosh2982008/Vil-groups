/** A product can be bought only when the owner has not marked it out of stock and quantity > 0. */
const isAvailable = (p: Product): boolean => p.available !== false && p.stock > 0;

function couponDiscount(c: Coupon, subtotal: number): number {
  let d = c.type === 'percent' ? (subtotal * c.value) / 100 : Math.min(c.value, subtotal);
  if (c.type === 'percent' && c.maxDiscount > 0) d = Math.min(d, c.maxDiscount);
  return Math.max(0, Math.round(d));
}

type CouponResult = { ok: true; coupon: Coupon; discount: number } | { ok: false; error: string };

function evaluateCoupon(code: string, subtotal: number, coupons: Coupon[], now: Date = new Date()): CouponResult {
  const wanted = code.trim().toUpperCase();
  if (!wanted) return { ok: false, error: 'Enter a coupon code.' };
  const c = coupons.find((x) => x.code.trim().toUpperCase() === wanted);
  if (!c) return { ok: false, error: 'This coupon code is not valid.' };
  if (!c.active) return { ok: false, error: 'This coupon is not active.' };
  if (c.expiresAt && new Date(c.expiresAt + 'T23:59:59').getTime() < now.getTime()) {
    return { ok: false, error: 'This coupon has expired.' };
  }
  if (subtotal < c.minOrder) {
    return { ok: false, error: `Add items worth ${inr(c.minOrder - subtotal)} more (excl. GST) to use this coupon.` };
  }
  return { ok: true, coupon: c, discount: couponDiscount(c, subtotal) };
}

function computeTotals(subtotal: number, settings: Settings, coupon: Coupon | null, courier: Courier | null): Totals {
  const discount = coupon ? couponDiscount(coupon, subtotal) : 0;
  const taxable = Math.max(0, subtotal - discount);
  const gst = (taxable * settings.gstRate) / 100;
  const free = settings.freeShippingAbove > 0 && taxable >= settings.freeShippingAbove;
  const shipping = subtotal === 0 || free || !courier ? 0 : courier.charge;
  return {
    subtotal,
    discount,
    gst,
    shipping,
    total: taxable + gst + shipping,
    shippingPending: subtotal > 0 && !free && !courier,
  };
}

/** Resize an uploaded image in the browser so it stays small enough for local storage. */
function resizeImage(file: File, maxDim: number, mime: 'image/jpeg' | 'image/png', quality = 0.82): Promise<string> {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject(new Error('Choose an image file (JPG, PNG or WebP).'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('That file could not be read.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That image could not be opened.'));
      img.onload = () => {
        const iw = img.naturalWidth || 300;
        const ih = img.naturalHeight || 300;
        const scale = Math.min(1, maxDim / Math.max(iw, ih));
        const w = Math.max(1, Math.round(iw * scale));
        const h = Math.max(1, Math.round(ih * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (!ctx) {
          reject(new Error('Image processing is not available in this browser.'));
          return;
        }
        if (mime === 'image/jpeg') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
        }
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(mime, quality));
      };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

    .map((l) => l.trim())
    .filter(Boolean)
    .map((l) => {
      const i = l.indexOf(':');
      return i === -1 ? { label: l, value: '' } : { label: l.slice(0, i).trim(), value: l.slice(i + 1).trim() };
    });
}

/**
 * Password handling. Passwords are never stored: each account keeps a random
 * salt and a PBKDF2-SHA256 hash derived with the browser's WebCrypto API.
 */

const ITERATIONS = 310_000;
const encoder = new TextEncoder();

const toB64 = (bytes: ArrayBuffer | Uint8Array): string => {
  const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let bin = '';
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
};
const fromB64 = (s: string): Uint8Array => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

interface PasswordHash {
  salt: string;
  hash: string;
  iterations: number;
}

async function hashPassword(password: string, saltB64?: string, iterations: number = ITERATIONS): Promise<PasswordHash> {
  if (typeof crypto === 'undefined' || !crypto.subtle) {
    throw new Error('Secure sign-in needs HTTPS. Open the site over https:// and try again.');
  }
  const salt = saltB64 ? fromB64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt as BufferSource, iterations, hash: 'SHA-256' }, key, 256);
  return { salt: toB64(salt), hash: toB64(bits), iterations };
}

function timingSafeEqual(a: string, b: string): boolean {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

/** Human-readable list of what a password is still missing. Empty = acceptable. */
function passwordProblems(pw: string): string[] {
  const out: string[] = [];
  if (pw.length < 8) out.push('at least 8 characters');
  if (!/[a-z]/.test(pw)) out.push('a lowercase letter');
  if (!/[A-Z]/.test(pw)) out.push('an uppercase letter');
  if (!/\d/.test(pw)) out.push('a number');
  return out;
}

/** 0 (empty) to 4 (strong), for the strength meter. */
function passwordStrength(pw: string): number {
  if (!pw) return 0;
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if (/\d/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw) || pw.length >= 14) score++;
  return score;
}

type RouteId =
  | 'home'
  | 'service-center'
  | 'store'
  | 'manufacturing'
  | 'service-enquiry'
  | 'cart'
  | 'checkout'
  | 'login'
  | 'admin';

const ROUTE_IDS: RouteId[] = [
  'home',
  'service-center',
  'store',
  'manufacturing',
  'service-enquiry',
  'cart',
  'checkout',
  'login',
  'admin',
];

/**
 * Role-based access table. This is the single source of truth for who can
 * open which page. Standard users get browsing, cart, checkout and enquiries;
 * only the admin role reaches the Management Dashboard.
 */
const ROUTE_ACCESS: Record<RouteId, Role[]> = {
  home: ['guest', 'customer', 'admin'],
  'service-center': ['guest', 'customer', 'admin'],
  store: ['guest', 'customer', 'admin'],
  manufacturing: ['guest', 'customer', 'admin'],
  'service-enquiry': ['guest', 'customer', 'admin'],
  cart: ['guest', 'customer', 'admin'],
  checkout: ['customer', 'admin'],
  login: ['guest', 'customer', 'admin'],
  admin: ['admin'],
};

function readRoute(): RouteId {
  const h = window.location.hash.replace('#', '');
  return (ROUTE_IDS as string[]).includes(h) ? (h as RouteId) : 'home';
}

function go(route: RouteId): void {
  if (window.location.hash === '#' + route) {
    window.scrollTo(0, 0);
    return;
  }
  window.location.hash = route;
}

function useRoute(): RouteId {
  const [route, setRoute] = useState<RouteId>(readRoute());
  useEffect(() => {
    const onChange = () => {
      setRoute(readRoute());
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return route;
}

/* ---------- localStorage persistence (the "mock database") ---------- */

function loadKey<T>(key: string, fallback: T): T {
  try {
    const raw = window.localStorage.getItem(KEY_PREFIX + key);
    return raw ? (JSON.parse(raw) as T) : fallback;
  } catch {
    return fallback;
  }
}

function saveKey(key: string, value: unknown): void {
  try {
    window.localStorage.setItem(KEY_PREFIX + key, JSON.stringify(value));
  } catch {
    // Most often the browser's ~5 MB quota, caused by large uploaded images.
    window.dispatchEvent(new CustomEvent('vel-storage-error'));
  }
}

function usePersisted<T>(key: string, initial: T) {
  const [value, setValue] = useState<T>(() => loadKey<T>(key, initial));
  useEffect(() => {
    saveKey(key, value);
  }, [key, value]);
  return [value, setValue] as const;
}

/* ---------- context ---------- */

interface Toast {
  id: number;
  message: string;
}

interface CartDetail {
  line: CartLine;
  product: Product;
}

interface Quote {
  totals: Totals;
  coupon: Coupon | null;
  courier: Courier | null;
  couponError: string;
}

interface AppCtx {
  session: Session | null;
  role: Role;
  products: Product[];
  /** products the public can see (not hidden by the owner) */
  catalog: Product[];
  services: Service[];
  company: Company;
  settings: Settings;
  orders: Order[];
  enquiries: Enquiry[];
  cart: CartLine[];
  cartDetail: CartDetail[];
  cartCount: number;
  totals: Totals;
  quote: (couponCode: string, courierId: string) => Quote;
  prefill: string;
  setPrefill: (topic: string) => void;
  toasts: Toast[];
  notify: (message: string) => void;
  register: (email: string, name: string, password: string) => Promise<string | null>;
  login: (email: string, password: string) => Promise<string | null>;
  signOut: () => void;
  addToCart: (productId: string, qty?: number) => void;
  setQty: (productId: string, qty: number) => void;
  removeFromCart: (productId: string) => void;
  placeOrder: (ship: ShippingInfo, paymentId: string, courierId: string, couponCode: string) => PlaceResult;
  submitEnquiry: (e: Omit<Enquiry, 'id' | 'createdAt' | 'status'>) => Enquiry;
  saveProduct: (p: Product) => boolean;
  deleteProduct: (id: string) => void;
  saveService: (s: Service) => boolean;
  deleteService: (id: string) => void;
  saveCompany: (c: Company) => boolean;
  saveSettings: (s: Settings) => boolean;
  setOrderStatus: (id: string, status: OrderStatus) => void;
  setEnquiryStatus: (id: string, status: EnquiryStatus) => void;
  resetAll: () => void;
}

const Ctx = createContext<AppCtx | null>(null);

function useApp(): AppCtx {
  const v = useContext(Ctx);
  if (!v) throw new Error('useApp must be used inside <AppProvider>');
  return v;
}

function AppProvider({ children }: { children: ReactNode }) {
  const [storedSession, setSession] = usePersisted<Session | null>('session', null);
  const [users, setUsers] = usePersisted<UserRecord[]>('users', []);
  const [, setClock] = useState(0);
  // A session is only valid until its expiry time; older sessions (no expiry) are rejected.
  const session: Session | null =
    storedSession && typeof storedSession.expiresAt === 'number' && storedSession.expiresAt > Date.now() ? storedSession : null;
  const [products, setProducts] = usePersisted<Product[]>('products', SEED_PRODUCTS);
  const [services, setServices] = usePersisted<Service[]>('services', SEED_SERVICES);
  const [company, setCompany] = usePersisted<Company>('company', SEED_COMPANY);
  const [settings, setSettings] = usePersisted<Settings>('settings', SEED_SETTINGS);
  const [orders, setOrders] = usePersisted<Order[]>('orders', []);
  const [enquiries, setEnquiries] = usePersisted<Enquiry[]>('enquiries', []);
  const [cart, setCart] = usePersisted<CartLine[]>('cart', []);
  const [prefill, setPrefill] = useState('');
  const [toasts, setToasts] = useState<Toast[]>([]);

  // Role is derived from the signed-in email every render, never stored.
  const role: Role = session
    ? ADMIN_EMAILS.map((e) => e.toLowerCase()).includes(session.email.toLowerCase())
      ? 'admin'
      : 'customer'
    : 'guest';

  const notify = useCallback((message: string) => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, message }]);
    window.setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);

  useEffect(() => {
    const onFull = () => notify('Browser storage is full. Remove or shrink large images, then save again.');
    window.addEventListener('vel-storage-error', onFull);
    return () => window.removeEventListener('vel-storage-error', onFull);
  }, [notify]);

  const requireAdmin = (): boolean => {
    if (role !== 'admin') {
      notify('Administrator access required.');
      return false;
    }
    return true;
  };

  /* ----- auth ----- */
  // Re-check expiry every 30 s so an idle tab is signed out when its session runs out.
  useEffect(() => {
    const t = window.setInterval(() => setClock((n) => n + 1), 30_000);
    return () => window.clearInterval(t);
  }, []);
  useEffect(() => {
    if (storedSession && !session) setSession(null);
  }, [storedSession, session, setSession]);

  const startSession = (email: string, name: string) =>
    setSession({ email, name, expiresAt: Date.now() + SESSION_HOURS * 3600_000 });

  const GENERIC_LOGIN_ERROR = 'Incorrect email or password.';

  const register = async (email: string, name: string, password: string): Promise<string | null> => {
    const e = email.trim().toLowerCase();
    if (!isValidEmail(e)) return 'Enter a valid email address.';
    if (name.trim().length < 2) return 'Enter your name.';
    const problems = passwordProblems(password);
    if (problems.length > 0) return `Your password needs ${problems.join(', ')}.`;
    if (users.some((u) => u.email === e)) return 'An account with this email already exists. Sign in instead.';
    try {
      const h = await hashPassword(password);
      const user: UserRecord = {
        email: e,
        name: name.trim(),
        ...h,
        createdAt: new Date().toISOString(),
        failed: 0,
        lockedUntil: 0,
      };
      setUsers((prev) => (prev.some((u) => u.email === e) ? prev : [...prev, user]));
      startSession(e, user.name);
      return null;
    } catch (err) {
      return err instanceof Error ? err.message : 'Could not create the account.';
    }
  };

  const login = async (email: string, password: string): Promise<string | null> => {
    const e = email.trim().toLowerCase();
    if (!isValidEmail(e) || !password) return GENERIC_LOGIN_ERROR;
    const user = users.find((u) => u.email === e);
    try {
      if (!user) {
        await hashPassword(password); // same work as a real check, so timing does not reveal unknown emails
        return GENERIC_LOGIN_ERROR;
      }
      if (user.lockedUntil > Date.now()) {
        const mins = Math.max(1, Math.ceil((user.lockedUntil - Date.now()) / 60000));
        return `Too many failed attempts. Try again in ${mins} minute${mins === 1 ? '' : 's'}.`;
      }
      const h = await hashPassword(password, user.salt, user.iterations);
      if (!timingSafeEqual(h.hash, user.hash)) {
        const failed = user.failed + 1;
        const lock = failed >= MAX_FAILED_LOGINS;
        setUsers((prev) =>
          prev.map((u) =>
            u.email === e ? { ...u, failed: lock ? 0 : failed, lockedUntil: lock ? Date.now() + LOCKOUT_MINUTES * 60000 : u.lockedUntil } : u,
          ),
        );
        return lock ? `Too many failed attempts. Sign-in is locked for ${LOCKOUT_MINUTES} minutes.` : GENERIC_LOGIN_ERROR;
      }
      setUsers((prev) => prev.map((u) => (u.email === e ? { ...u, failed: 0, lockedUntil: 0 } : u)));
      startSession(e, user.name);
      return null;
    } catch (err) {
      return err instanceof Error ? err.message : 'Could not sign in.';
    }
  };

  const signOut = () => setSession(null);

  /* ----- catalog (hidden products never reach the public) ----- */
  const catalog = useMemo(() => products.filter((p) => !p.hidden), [products]);

  /* ----- cart ----- */
  const addToCart = (productId: string, qty = 1) => {
    const p = catalog.find((x) => x.id === productId);
    if (!p || !isAvailable(p)) {
      notify('This product is out of stock.');
      return;
    }
    setCart((prev) => {
      const existing = prev.find((l) => l.productId === productId);
      const nextQty = Math.min((existing?.qty ?? 0) + qty, p.stock);
      if (existing) return prev.map((l) => (l.productId === productId ? { ...l, qty: nextQty } : l));
      return [...prev, { productId, qty: Math.min(qty, p.stock) }];
    });
    notify(`${p.name} added to cart`);
  };
  const setQty = (productId: string, qty: number) => {
    const p = catalog.find((x) => x.id === productId);
    if (!p) return;
    const q = Math.max(1, Math.min(Math.floor(qty) || 1, Math.max(p.stock, 1)));
    setCart((prev) => prev.map((l) => (l.productId === productId ? { ...l, qty: q } : l)));
  };
  const removeFromCart = (productId: string) => setCart((prev) => prev.filter((l) => l.productId !== productId));

  const cartDetail: CartDetail[] = useMemo(
    () =>
      cart
        .map((line) => ({ line, product: catalog.find((p) => p.id === line.productId) }))
        .filter((x): x is CartDetail => Boolean(x.product)),
    [cart, catalog],
  );
  const cartCount = cartDetail.reduce((n, d) => n + d.line.qty, 0);
  const subtotal = cartDetail.reduce((s, d) => s + d.product.price * d.line.qty, 0);
  const totals = computeTotals(subtotal, settings, null, null);

  /** Price the current cart with an optional coupon code and courier. */
  const quote = (couponCode: string, courierId: string): Quote => {
    const enabled = settings.couriers.filter((c) => c.enabled);
    const courier = enabled.find((c) => c.id === courierId) ?? enabled[0] ?? null;
    let coupon: Coupon | null = null;
    let couponError = '';
    if (couponCode.trim()) {
      const r = evaluateCoupon(couponCode, subtotal, settings.coupons);
      if (r.ok) coupon = r.coupon;
      else couponError = r.error;
    }
    return { totals: computeTotals(subtotal, settings, coupon, courier), coupon, courier, couponError };
  };

  /* ----- checkout ----- */
  const placeOrder = (ship: ShippingInfo, paymentId: string, courierId: string, couponCode: string): PlaceResult => {
    if (!session) return { ok: false, error: 'Please sign in to place an order.' };
    if (cartDetail.length === 0) return { ok: false, error: 'Your cart is empty.' };
    for (const d of cartDetail) {
      if (!isAvailable(d.product)) return { ok: false, error: `"${d.product.name}" is out of stock. Remove it from your cart.` };
      if (d.line.qty > d.product.stock) {
        return { ok: false, error: `Only ${d.product.stock} of "${d.product.name}" left in stock.` };
      }
    }
    const payment = settings.payments.find((p) => p.enabled && p.id === paymentId);
    if (!payment) return { ok: false, error: 'Choose a payment method.' };
    const q = quote(couponCode, courierId);
    if (couponCode.trim() && q.couponError) return { ok: false, error: q.couponError };
    const hasCouriers = settings.couriers.some((c) => c.enabled);
    if (hasCouriers && !q.courier) return { ok: false, error: 'Choose a delivery option.' };

    const order: Order = {
      id: orderId(),
      createdAt: new Date().toISOString(),
      customerEmail: session.email,
      customerName: session.name,
      items: cartDetail.map((d) => ({
        productId: d.product.id,
        name: d.product.name,
        sku: d.product.sku,
        price: d.product.price,
        qty: d.line.qty,
      })),
      subtotal: q.totals.subtotal,
      gst: q.totals.gst,
      shipping: q.totals.shipping,
      total: q.totals.total,
      status: 'Placed',
      payment: payment.label,
      ship,
      discount: q.totals.discount,
      coupon: q.coupon?.code,
      courier: q.courier?.name,
    };
    setProducts((prev) =>
      prev.map((p) => {
        const line = cart.find((l) => l.productId === p.id);
        return line ? { ...p, stock: Math.max(0, p.stock - line.qty) } : p;
      }),
    );
    setOrders((prev) => [order, ...prev]);
    setCart([]);
    return { ok: true, order };
  };

  /* ----- enquiries (open to every role) ----- */
  const submitEnquiry = (e: Omit<Enquiry, 'id' | 'createdAt' | 'status'>): Enquiry => {
    const enquiry: Enquiry = { ...e, id: uid('ENQ'), createdAt: new Date().toISOString(), status: 'New' };
    setEnquiries((prev) => [enquiry, ...prev]);
    return enquiry;
  };

  /* ----- admin-only mutations (each re-checks the role) ----- */
  const saveProduct = (p: Product): boolean => {
    if (!requireAdmin()) return false;
    setProducts((prev) => (prev.some((x) => x.id === p.id) ? prev.map((x) => (x.id === p.id ? p : x)) : [p, ...prev]));
    notify('Product saved');
    return true;
  };
  const deleteProduct = (id: string) => {
    if (!requireAdmin()) return;
    setProducts((prev) => prev.filter((x) => x.id !== id));
    setCart((prev) => prev.filter((l) => l.productId !== id));
    notify('Product deleted');
  };
  const saveService = (s: Service): boolean => {
    if (!requireAdmin()) return false;
    setServices((prev) => (prev.some((x) => x.id === s.id) ? prev.map((x) => (x.id === s.id ? s : x)) : [...prev, s]));
    notify('Service saved');
    return true;
  };
  const deleteService = (id: string) => {
    if (!requireAdmin()) return;
    setServices((prev) => prev.filter((x) => x.id !== id));
    notify('Service deleted');
  };
  const saveCompany = (c: Company): boolean => {
    if (!requireAdmin()) return false;
    setCompany(c);
    notify('Company details updated');
    return true;
  };
  const saveSettings = (s: Settings): boolean => {
    if (!requireAdmin()) return false;
    setSettings(s);
    notify('Settings saved');
    return true;
  };
  const setOrderStatus = (id: string, status: OrderStatus) => {
    if (!requireAdmin()) return;
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, status } : o)));
  };
  const setEnquiryStatus = (id: string, status: EnquiryStatus) => {
    if (!requireAdmin()) return;
    setEnquiries((prev) => prev.map((e) => (e.id === id ? { ...e, status } : e)));
  };
  const resetAll = () => {
    if (!requireAdmin()) return;
    setProducts(SEED_PRODUCTS);
    setServices(SEED_SERVICES);
    setCompany(SEED_COMPANY);
    setSettings(SEED_SETTINGS);
    setOrders([]);
    setEnquiries([]);
    setCart([]);
    notify('Sample data restored');
  };

  const value: AppCtx = {
    session,
    role,
    products,
    catalog,
    services,
    company,
    settings,
    orders,
    enquiries,
    cart,
    cartDetail,
    cartCount,
    totals,
    quote,
    prefill,
    setPrefill,
    toasts,
    notify,
    register,
    login,
    signOut,
    addToCart,
    setQty,
    removeFromCart,
    placeOrder,
    submitEnquiry,
    saveProduct,
    deleteProduct,
    saveService,
    deleteService,
    saveCompany,
    saveSettings,
    setOrderStatus,
    setEnquiryStatus,
    resetAll,
  };

  return <Ctx.Provider value={value}>{children}</Ctx.Provider>;
}

function Modal({
  title,
  onClose,
  children,
  wide = false,
}: {
  title: string;
  onClose: () => void;
  children: ReactNode;
  wide?: boolean;
}) {
  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [onClose]);

  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-ink/60 sm:items-center sm:p-6"
      role="dialog"
      aria-modal="true"
      aria-label={title}
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div
        className={`max-h-[92vh] w-full overflow-y-auto bg-white shadow-2xl sm:rounded-sm ${wide ? 'sm:max-w-3xl' : 'sm:max-w-lg'}`}
      >
        <div className="sticky top-0 z-10 flex items-center justify-between border-b border-steel-200 bg-white px-5 py-3">
          <h2 className="text-2xl font-semibold">{title}</h2>
          <button type="button" onClick={onClose} className="rounded-sm p-1.5 text-ink-500 hover:bg-steel-100" aria-label="Close">
            <Icon name="x" />
          </button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

/** Product photo when the owner uploaded one, otherwise a blueprint-style placeholder. */
function ProductArt({ seed, className = '', image }: { seed: string; className?: string; image?: string }) {
  if (image) {
    return (
      <div className={`relative overflow-hidden bg-white ${className}`}>
        <img src={image} alt="" className="h-full w-full object-contain" />
      </div>
    );
  }
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 997;
  const teeth = 14 + (h % 10);
  const circumference = 2 * Math.PI * 34;
  const dash = circumference / (teeth * 2);
  const rotate = h % 45;
  return (
    <div className={`relative overflow-hidden bg-steel-100 ${className}`}>
      <svg viewBox="0 0 200 140" className="h-full w-full text-ink-500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id={`grid-${seed}`} width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0V20" fill="none" stroke="#B3BFCD" strokeWidth="0.6" />
          </pattern>
        </defs>
        <rect width="200" height="140" fill={`url(#grid-${seed})`} />
        <g transform={`translate(100 70) rotate(${rotate})`} fill="none" stroke="currentColor">
          <circle r="34" strokeWidth="12" strokeDasharray={`${dash} ${dash}`} />
          <circle r="27" strokeWidth="1.5" />
          <circle r="12" strokeWidth="1.5" />
          <path d="M-46 0H46 M0 -46V46" strokeWidth="0.8" strokeDasharray="4 3" />
        </g>
      </svg>
    </div>
  );
}

/** Upload, preview and remove an image. Files are resized in the browser before saving. */
function ImagePicker({
  id,
  label,
  value,
  onChange,
  maxDim,
  mime,
  hint,
  previewClass = 'h-28 w-28',
}: {
  id: string;
  label: string;
  value: string;
  onChange: (dataUrl: string) => void;
  maxDim: number;
  mime: 'image/jpeg' | 'image/png';
  hint?: string;
  previewClass?: string;
}) {
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const pick = async (file: File | undefined) => {
    if (!file) return;
    setBusy(true);
    setError('');
    try {
      onChange(await resizeImage(file, maxDim, mime));
    } catch (e) {
      setError(e instanceof Error ? e.message : 'Upload failed.');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div>
      <label htmlFor={id} className="label">
        {label}
      </label>
      <div className="flex flex-wrap items-center gap-4">
        <div className={`flex shrink-0 items-center justify-center border border-dashed border-steel-300 bg-steel-50 ${previewClass}`}>
          {value ? <img src={value} alt="" className="max-h-full max-w-full object-contain" /> : <Icon name="box" className="h-8 w-8 text-steel-300" />}
        </div>
        <div className="space-y-2">
          <input
            id={id}
            type="file"
            accept="image/png,image/jpeg,image/webp,image/svg+xml"
            className="block max-w-[15rem] text-sm file:mr-3 file:rounded-sm file:border file:border-steel-300 file:bg-white file:px-3 file:py-1.5 file:text-sm file:font-semibold hover:file:bg-steel-100"
            onChange={(e) => {
              void pick(e.target.files?.[0]);
              e.target.value = '';
            }}
          />
          {value ? (
            <button type="button" className="text-sm font-semibold text-bad hover:underline" onClick={() => onChange('')}>
              Remove image
            </button>
          ) : null}
          {busy ? <p className="text-xs text-ink-500">Processing image…</p> : null}
        </div>
      </div>
      {hint && !error ? <p className="mt-1 text-xs text-steel-500">{hint}</p> : null}
      {error ? (
        <p className="mt-1 text-xs font-medium text-bad" role="alert">
          {error}
        </p>
      ) : null}
    </div>
  );
}

function Stepper({
  value,
  max,
  onChange,
  label,
}: {
  value: number;
  max: number;
  onChange: (n: number) => void;
  label: string;
}) {
  return (
    <div className="inline-flex items-center border border-steel-300 bg-white" role="group" aria-label={label}>
      <button
        type="button"
        className="px-2.5 py-2 text-ink hover:bg-steel-100 disabled:opacity-40"
        onClick={() => onChange(value - 1)}
        disabled={value <= 1}
        aria-label="Decrease quantity"
      >
        <Icon name="minus" className="h-4 w-4" />
      </button>
      <span className="min-w-[2.5rem] text-center font-mono text-sm tabular-nums" aria-live="polite">
        {value}
      </span>
      <button
        type="button"
        className="px-2.5 py-2 text-ink hover:bg-steel-100 disabled:opacity-40"
        onClick={() => onChange(value + 1)}
        disabled={value >= max}
        aria-label="Increase quantity"
      >
        <Icon name="plus" className="h-4 w-4" />
      </button>
    </div>
  );
}

function Store() {

  const [category, setCategory] = useState('All');
  const [sort, setSort] = useState<SortKey>('featured');
  const [inStockOnly, setInStockOnly] = useState(false);
  const [openId, setOpenId] = useState<string | null>(null);

  const categories = useMemo(() => ['All', ...Array.from(new Set(products.map((p) => p.category))).sort()], [products]);

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase();
    let list = products.filter((p) => {
      if (category !== 'All' && p.category !== category) return false;
      if (inStockOnly && !isAvailable(p)) return false;
      if (!q) return true;
      return [p.name, p.sku, p.brand, p.category].some((v) => v.toLowerCase().includes(q));
    });
    if (sort === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    if (sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    if (sort === 'featured') list = [...list].sort((a, b) => Number(b.featured) - Number(a.featured));
    return list;
  }, [products, query, category, sort, inStockOnly]);

  const open = products.find((p) => p.id === openId) ?? null;

const GENERAL = 'General enquiry';
const QUOTE = 'Custom manufacturing quote';

interface Form {
  name: string;
  phone: string;
  email: string;
  topic: string;
  equipment: string;
  preferredDate: string;
  message: string;
}

function ServiceEnquiry() {
  const { services, company, session, prefill, setPrefill, submitEnquiry } = useApp();
  const topics = [...services.map((s) => s.name), QUOTE, GENERAL];

  const [form, setForm] = useState<Form>({
    name: session?.name ?? '',
    phone: '',
    email: session?.email ?? '',
    topic: prefill || topics[0],
    equipment: '',
    preferredDate: '',
    message: '',
  });
  const [errors, setErrors] = useState<Partial<Record<keyof Form, string>>>({});
  const [done, setDone] = useState<Enquiry | null>(null);

  useEffect(() => {
    if (prefill) {
      setForm((f) => ({ ...f, topic: prefill }));
      setPrefill('');
    }
  }, [prefill, setPrefill]);

  const set = (k: keyof Form, v: string) => setForm((f) => ({ ...f, [k]: v }));

  const submit = (e: FormEvent) => {
    e.preventDefault();
    const next: Partial<Record<keyof Form, string>> = {};
    if (form.name.trim().length < 2) next.name = 'Enter your name.';
    if (!isValidPhone(form.phone)) next.phone = 'Enter a phone number with at least 10 digits.';
    if (!isValidEmail(form.email)) next.email = 'Enter a valid email address.';
    if (form.message.trim().length < 10) next.message = 'Describe the problem or requirement in a few words.';
    setErrors(next);
    if (Object.keys(next).length > 0) return;
    setDone(submitEnquiry({ ...form, name: form.name.trim(), message: form.message.trim() }));
  };

  if (done) {
    return (
      <>
        <PageHeader eyebrow="Service Enquiry" title="Enquiry received" />
        <div className="wrap mt-10 max-w-2xl">
          <div className="panel p-8">
            <Icon name="check" className="h-10 w-10 text-ok" />
            <h2 className="mt-3 text-3xl font-semibold">Thank you, {done.name}.</h2>
            <p className="mt-2 text-ink-700">
              Our team will call you on <span className="font-mono">{done.phone}</span> during working hours ({company.hours}).
            </p>
            <p className="mt-4 font-mono text-sm">
              Reference <strong>{done.id}</strong>
            </p>
            <button
              type="button"
              className="btn-dark mt-6"
              onClick={() => {
                setDone(null);
                setForm((f) => ({ ...f, equipment: '', preferredDate: '', message: '' }));
              }}
            >
              Send another enquiry
            </button>
          </div>
        </div>
      </>
    );
  }

  return (
    <>
      <PageHeader
        eyebrow="Service Enquiry"
        title="Tell us what needs fixing, or building"
        lead="Fill in the form and a service engineer will call you the same working day."
      />

      <div className="wrap mt-10 grid gap-8 lg:grid-cols-[1fr_320px]">
        <form className="panel min-w-0 space-y-5 p-6" onSubmit={submit} noValidate>
          <div className="grid gap-5 sm:grid-cols-2">
            <Field label="Your name" htmlFor="enq-name" error={errors.name}>
              <input id="enq-name" className="field" autoComplete="name" value={form.name} onChange={(e) => set('name', e.target.value)} />
            </Field>
            <Field label="Phone" htmlFor="enq-phone" error={errors.phone}>
              <input id="enq-phone" className="field" inputMode="tel" autoComplete="tel" placeholder="+91" value={form.phone} onChange={(e) => set('phone', e.target.value)} />
            </Field>
          </div>

          <Field label="Email" htmlFor="enq-email" error={errors.email}>
            <input id="enq-email" type="email" className="field" autoComplete="email" value={form.email} onChange={(e) => set('email', e.target.value)} />
          </Field>

          <div className="grid gap-5 sm:grid-cols-2">
            <Field label="Enquiry type" htmlFor="enq-topic">
              <select id="enq-topic" className="field" value={form.topic} onChange={(e) => set('topic', e.target.value)}>
                {topics.map((t) => (
                  <option key={t} value={t}>
                    {t}
                  </option>
                ))}
              </select>
            </Field>
            <Field label="Preferred date (optional)" htmlFor="enq-date">
              <input id="enq-date" type="date" className="field" value={form.preferredDate} onChange={(e) => set('preferredDate', e.target.value)} />
            </Field>
          </div>

          <Field label="Equipment or part (optional)" htmlFor="enq-equipment" hint="Make, model, rating or part number helps us quote faster.">
            <input id="enq-equipment" className="field" placeholder="e.g. 15 kW pump motor, Crompton" value={form.equipment} onChange={(e) => set('equipment', e.target.value)} />
          </Field>

          <Field label="Describe the problem or requirement" htmlFor="enq-message" error={errors.message}>
            <textarea id="enq-message" rows={5} className="field" value={form.message} onChange={(e) => set('message', e.target.value)} />
          </Field>

          <button type="submit" className="btn-primary">
            Submit enquiry
          </button>
        </form>

        <aside className="min-w-0 space-y-4">
          <div className="bg-ink p-6 text-white">
            <h2 className="text-2xl font-semibold uppercase tracking-wide">Prefer to call?</h2>
            <p className="mt-3 font-mono text-lg">{company.phone}</p>
            {company.altPhone ? <p className="font-mono text-lg">{company.altPhone}</p> : null}
            <p className="mt-2 text-sm text-steel-200">{company.hours}</p>
          </div>
          <div className="panel p-5 text-sm text-ink-700">
            <p className="font-semibold text-ink">What happens next</p>
            <ol className="mt-2 list-decimal space-y-1 pl-5">
              <li>We log your enquiry and give it a reference number.</li>
              <li>An engineer calls to confirm the details.</li>
              <li>You receive a written quote or a visit date.</li>
            </ol>
          </div>
        </aside>
      </div>
    </>
  );
}

const EMPTY: ShippingInfo = { name: '', phone: '', line1: '', city: '', state: '', pincode: '' };

const FIELD_IDS: Record<keyof ShippingInfo, string> = {
  name: 'co-name',
  phone: 'co-phone',
  line1: 'co-line1',
  city: 'co-city',
  state: 'co-state',
  pincode: 'co-pin',
};

function Checkout() {
  const { cartDetail, session, placeOrder, settings, quote } = useApp();
  const [ship, setShip] = useState<ShippingInfo>({ ...EMPTY, name: session?.name ?? '' });
  const couriers = settings.couriers.filter((c) => c.enabled);
  const payments = settings.payments.filter((p) => p.enabled);
  const [courierId, setCourierId] = useState<string>(couriers[0]?.id ?? '');
  const [paymentId, setPaymentId] = useState<string>(payments[0]?.id ?? '');
  const [couponInput, setCouponInput] = useState('');
  const [appliedCode, setAppliedCode] = useState('');
  const [couponMsg, setCouponMsg] = useState<{ ok: boolean; text: string } | null>(null);
  const [errors, setErrors] = useState<Partial<Record<keyof ShippingInfo, string>>>({});
  const [formError, setFormError] = useState('');
  const [order, setOrder] = useState<Order | null>(null);

  const set = (k: keyof ShippingInfo, v: string) => setShip((s) => ({ ...s, [k]: v }));

  // Re-validated on every render so a coupon that stops qualifying (e.g. cart changed) is dropped.
  const q = quote(appliedCode, courierId);
  const activeCode = q.coupon ? q.coupon.code : '';

  const applyCoupon = () => {
    const probe = quote(couponInput, courierId);
    if (!couponInput.trim()) {
      setCouponMsg({ ok: false, text: 'Enter a coupon code.' });
      return;
    }
    if (probe.couponError || !probe.coupon) {
      setAppliedCode('');
      setCouponMsg({ ok: false, text: probe.couponError || 'This coupon code is not valid.' });
      return;
    }
    setAppliedCode(probe.coupon.code);
    setCouponInput('');
    setCouponMsg({ ok: true, text: `${probe.coupon.code} applied. You save ${inr(probe.totals.discount)}.` });
  };

  const removeCoupon = () => {
    setAppliedCode('');
    setCouponMsg(null);
  };

  const submit = (e: FormEvent) => {
    e.preventDefault();
    const next: Partial<Record<keyof ShippingInfo, string>> = {};
    if (ship.name.trim().length < 2) next.name = 'Enter the recipient name.';
    if (!isValidPhone(ship.phone)) next.phone = 'Enter a phone number with at least 10 digits.';
    if (ship.line1.trim().length < 5) next.line1 = 'Enter the delivery address.';
    if (ship.city.trim().length < 2) next.city = 'Enter the city.';
    if (ship.state.trim().length < 2) next.state = 'Enter the state.';
    if (!/^\d{6}$/.test(ship.pincode.trim())) next.pincode = 'Enter a 6-digit PIN code.';
    setErrors(next);
    const missing = Object.keys(next) as (keyof ShippingInfo)[];
    if (missing.length > 0) {
      setFormError('Please complete the highlighted delivery details above, then place your order again.');
      // bring the first invalid field into view so the click never looks like it did nothing
      const first = document.getElementById(FIELD_IDS[missing[0]]);
      first?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      first?.focus({ preventScroll: true });
      return;
    }

    const result = placeOrder(
      {
        name: ship.name.trim(),
        phone: ship.phone.trim(),
        line1: ship.line1.trim(),
        city: ship.city.trim(),
        state: ship.state.trim(),
        pincode: ship.pincode.trim(),
      },
      paymentId,
      courierId,
      activeCode,
    );
    if (result.ok) {
      setFormError('');
      setOrder(result.order);
      window.scrollTo({ top: 0 });
    } else {
      setFormError(result.error);
    }
  };

  if (order) {
    return (
      <>
        <PageHeader eyebrow="Checkout" title="Order placed" />
        <div className="wrap mt-10 max-w-3xl">
          <div className="panel p-6 sm:p-8">
            <Icon name="check" className="h-10 w-10 text-ok" />
            <h2 className="mt-3 text-3xl font-semibold">Thank you, {order.customerName}.</h2>
            <p className="mt-1 text-ink-700">
              Order <strong className="font-mono">{order.id}</strong> was placed on {fmtDate(order.createdAt)}. Payment: {order.payment}.
              {order.courier ? ` Delivery: ${order.courier}.` : ''}
            </p>

            <div className="mt-5 overflow-x-auto border border-steel-200">
              <table className="w-full text-sm">
                <thead className="bg-steel-100 text-left">
                  <tr>
                    <th className="px-3 py-2">Item</th>
                    <th className="px-3 py-2 text-right">Qty</th>
                    <th className="px-3 py-2 text-right">Amount</th>
                  </tr>
                </thead>
                <tbody>
                  {order.items.map((i) => (
                    <tr key={i.productId} className="border-t border-steel-200">
                      <td className="px-3 py-2">
                        {i.name}
                        <span className="block font-mono text-xs text-steel-500">{i.sku}</span>
                      </td>
                      <td className="px-3 py-2 text-right font-mono tabular-nums">{i.qty}</td>
                      <td className="px-3 py-2 text-right font-mono tabular-nums">{inr(i.price * i.qty)}</td>
                    </tr>
                  ))}
                </tbody>
                <tfoot className="border-t border-steel-200">
                  {order.discount ? (
                    <tr className="text-ok">
                      <td className="px-3 py-2" colSpan={2}>
                        Coupon {order.coupon}
                      </td>
                      <td className="px-3 py-2 text-right font-mono tabular-nums">−{inr(order.discount)}</td>
                    </tr>
                  ) : null}
                  <tr className="font-semibold">
                    <td className="px-3 py-2" colSpan={2}>
                      Total incl. GST and shipping
                    </td>
                    <td className="px-3 py-2 text-right font-mono tabular-nums">{inr(order.total)}</td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <p className="mt-4 text-sm text-ink-700">
              Delivering to {order.ship.name}, {order.ship.line1}, {order.ship.city}, {order.ship.state} {order.ship.pincode}.
            </p>
            <a href="#store" className="btn-dark mt-6">
              Continue shopping
            </a>
          </div>
        </div>
      </>
    );
  }

  if (cartDetail.length === 0) {
    return (
      <>
        <PageHeader eyebrow="Checkout" title="Nothing to check out" />
        <div className="wrap mt-10">
          <div className="panel p-8 text-center">
            <p className="text-xl font-semibold">Your cart is empty.</p>
            <a href="#store" className="btn-primary mt-4">
              Browse the store
            </a>
          </div>
        </div>
      </>
    );
  }

  return (
    <>
      <PageHeader eyebrow="Checkout" title="Delivery and payment" />
      <form className="wrap mt-8 grid gap-8 lg:grid-cols-[1fr_360px]" onSubmit={submit} noValidate>
        <div className="min-w-0 space-y-6">
          <section className="panel space-y-5 p-6" aria-labelledby="ship-h">
            <h2 id="ship-h" className="text-2xl font-semibold">
              Delivery address
            </h2>
            <div className="grid gap-5 sm:grid-cols-2">
              <Field label="Recipient name" htmlFor="co-name" error={errors.name}>
                <input id="co-name" className="field" autoComplete="name" value={ship.name} onChange={(e) => set('name', e.target.value)} />
              </Field>
              <Field label="Phone" htmlFor="co-phone" error={errors.phone}>
                <input id="co-phone" className="field" inputMode="tel" autoComplete="tel" value={ship.phone} onChange={(e) => set('phone', e.target.value)} />
              </Field>
            </div>
            <Field label="Address" htmlFor="co-line1" error={errors.line1}>
              <input id="co-line1" className="field" autoComplete="street-address" placeholder="Plant, street, area" value={ship.line1} onChange={(e) => set('line1', e.target.value)} />
            </Field>
            <div className="grid gap-5 sm:grid-cols-3">
              <Field label="City" htmlFor="co-city" error={errors.city}>
                <input id="co-city" className="field" autoComplete="address-level2" value={ship.city} onChange={(e) => set('city', e.target.value)} />
              </Field>
              <Field label="State" htmlFor="co-state" error={errors.state}>
                <input id="co-state" className="field" autoComplete="address-level1" value={ship.state} onChange={(e) => set('state', e.target.value)} />
              </Field>
              <Field label="PIN code" htmlFor="co-pin" error={errors.pincode}>
                <input id="co-pin" className="field" inputMode="numeric" maxLength={6} autoComplete="postal-code" value={ship.pincode} onChange={(e) => set('pincode', e.target.value)} />
              </Field>
            </div>
          </section>

          {couriers.length > 0 ? (
            <fieldset className="panel p-6">
              <legend className="px-1 text-2xl font-semibold">Delivery option</legend>
              <div className="mt-2 space-y-2">
                {couriers.map((c) => {
                  const free = q.totals.shipping === 0 && !q.totals.shippingPending && settings.freeShippingAbove > 0 && q.totals.subtotal - q.totals.discount >= settings.freeShippingAbove;
                  return (
                    <label key={c.id} htmlFor={`co-courier-${c.id}`} className={`flex cursor-pointer items-start gap-3 border p-3 text-sm ${courierId === c.id || (!courierId && c === couriers[0]) ? 'border-ink bg-steel-50' : 'border-steel-200'}`}>
                      <input
                        id={`co-courier-${c.id}`}
                        type="radio"
                        name="courier"
                        className="mt-0.5 accent-[#B45309]"
                        checked={(courierId || couriers[0].id) === c.id}
                        onChange={() => setCourierId(c.id)}
                      />
                      <span className="min-w-0 flex-1">
                        <span className="block font-semibold">{c.name}</span>
                        <span className="block font-mono text-xs text-ink-500">{c.eta}</span>
                      </span>
                      <span className="shrink-0 font-mono tabular-nums">{free ? 'Free' : inr(c.charge)}</span>
                    </label>
                  );
                })}
              </div>
            </fieldset>
          ) : null}

          <fieldset className="panel p-6">
            <legend className="px-1 text-2xl font-semibold">Payment method</legend>
            {payments.length === 0 ? (
              <p className="mt-2 text-sm font-medium text-bad">No payment method is available right now. Please call us to place this order.</p>
            ) : (
              <div className="mt-2 space-y-2">
                {payments.map((m) => (
                  <label key={m.id} htmlFor={`co-pay-${m.id}`} className={`flex cursor-pointer items-start gap-3 border p-3 text-sm ${paymentId === m.id ? 'border-ink bg-steel-50' : 'border-steel-200'}`}>
                    <input id={`co-pay-${m.id}`} type="radio" name="payment" className="mt-0.5 accent-[#B45309]" checked={paymentId === m.id} onChange={() => setPaymentId(m.id)} />
                    <span className="min-w-0">
                      <span className="block font-semibold">{m.label}</span>
                      {m.instructions ? <span className="block text-xs text-ink-500">{m.instructions}</span> : null}
                    </span>
                  </label>
                ))}
              </div>
            )}
            <p className="mt-3 text-xs text-ink-500">No card details are collected on this site.</p>
          </fieldset>
        </div>

        <aside className="min-w-0 lg:sticky lg:top-32 lg:self-start">
          <div className="panel p-5">
            <h2 className="mb-3 text-2xl font-semibold">Order summary</h2>
            <ul className="mb-4 space-y-2 border-b border-steel-200 pb-4 text-sm">
              {cartDetail.map(({ line, product }) => (
                <li key={product.id} className="flex justify-between gap-3">
                  <span className="min-w-0">
                    {product.name} <span className="font-mono text-steel-500">× {line.qty}</span>
                  </span>
                  <span className="shrink-0 font-mono tabular-nums">{inr(product.price * line.qty)}</span>
                </li>
              ))}
            </ul>

            <div className="mb-4 border-b border-steel-200 pb-4">
              <label htmlFor="co-coupon" className="label">
                Coupon code
              </label>
              {activeCode ? (
                <div className="flex items-center justify-between gap-2 bg-green-50 px-3 py-2 text-sm text-ok">
                  <span className="font-mono font-semibold">{activeCode}</span>
                  <button type="button" className="font-semibold underline" onClick={removeCoupon}>
                    Remove
                  </button>
                </div>
              ) : (
                <div className="flex gap-2">
                  <input
                    id="co-coupon"
                    className="field font-mono uppercase"
                    placeholder="Enter code"
                    autoComplete="off"
                    value={couponInput}
                    onChange={(e) => setCouponInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        applyCoupon();
                      }
                    }}
                  />
                  <button type="button" className="btn-ghost shrink-0" onClick={applyCoupon}>
                    Apply
                  </button>
                </div>
              )}
              {couponMsg ? (
                <p className={`mt-1 text-xs font-medium ${couponMsg.ok ? 'text-ok' : 'text-bad'}`} role={couponMsg.ok ? 'status' : 'alert'}>
                  {couponMsg.text}
                </p>
              ) : null}
              {!activeCode && appliedCode && q.couponError ? (
                <p className="mt-1 text-xs font-medium text-bad" role="alert">
                  {q.couponError}
                </p>
              ) : null}
            </div>

            <OrderSummary t={q.totals} couponCode={activeCode} />
            {formError ? (
              <p className="mt-3 text-sm font-medium text-bad" role="alert">
                {formError}
              </p>
            ) : null}
            <button type="submit" className="btn-primary mt-4 w-full" disabled={payments.length === 0}>
              Place order
            </button>
            <a href="#cart" className="btn-ghost mt-2 w-full">
              Back to cart
            </a>
          </div>
        </aside>
      </form>
    </>
  );
}

/**
 * Email + password sign-in. Passwords are hashed (PBKDF2) before storage, accounts lock
 * after repeated failures and sessions expire. See src/auth.ts and src/store.tsx.
 * For production, replace register()/login() with a server-side auth provider.
 */
const STRENGTH_LABEL = ['', 'Weak', 'Fair', 'Good', 'Strong'];
const STRENGTH_COLOR = ['bg-steel-200', 'bg-bad', 'bg-forge', 'bg-forge', 'bg-ok'];

function Login({ reason, inPlace }: { reason?: string; inPlace: boolean }) {
  const { register, login } = useApp();
  const [mode, setMode] = useState<'login' | 'register'>('login');
  const [email, setEmail] = useState('');
  const [name, setName] = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [show, setShow] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const isRegister = mode === 'register';
  const strength = passwordStrength(password);

  const switchMode = (m: 'login' | 'register') => {
    setMode(m);
    setError('');
    setPassword('');
    setConfirm('');
  };

  const submit = async (e: FormEvent) => {
    e.preventDefault();
    if (busy) return;
    if (isRegister && password !== confirm) {
      setError('The two passwords do not match.');
      return;
    }
    setBusy(true);
    setError('');
    const err = isRegister ? await register(email, name, password) : await login(email, password);
    setBusy(false);
    if (err) {
      setError(err);
      setPassword('');
      setConfirm('');
      return;
    }
    if (!inPlace) {
      // role state updates after this handler, so compare against the config directly
      const isAdmin = ADMIN_EMAILS.map((a) => a.toLowerCase()).includes(email.trim().toLowerCase());
      go(isAdmin ? 'admin' : 'home');
    }
  };

  return (
    <div className="wrap flex justify-center py-14">
      <form className="panel w-full max-w-md space-y-5 p-6 sm:p-8" onSubmit={submit} noValidate>
        <div>
          <Icon name="user" className="h-8 w-8 text-ink-500" />
          <h1 className="mt-2 text-4xl font-semibold">{isRegister ? 'Create account' : 'Sign in'}</h1>
          <p className="mt-1 text-sm text-ink-700">
            {reason ?? (isRegister ? 'Register with your email and a password to check out and track your orders.' : 'Sign in with your email and password.')}
          </p>
        </div>

        <div role="tablist" aria-label="Account" className="grid grid-cols-2 border border-steel-300">
          <button type="button" role="tab" aria-selected={!isRegister} onClick={() => switchMode('login')} className={`px-3 py-2 text-sm font-semibold ${!isRegister ? 'bg-ink text-white' : 'bg-white hover:bg-steel-100'}`}>
            Sign in
          </button>
          <button type="button" role="tab" aria-selected={isRegister} onClick={() => switchMode('register')} className={`px-3 py-2 text-sm font-semibold ${isRegister ? 'bg-ink text-white' : 'bg-white hover:bg-steel-100'}`}>
            Create account
          </button>
        </div>

        {isRegister ? (
          <Field label="Your name" htmlFor="login-name">
            <input id="login-name" className="field" autoComplete="name" value={name} onChange={(e) => setName(e.target.value)} />
          </Field>
        ) : null}

        <Field label="Email address" htmlFor="login-email">
          <input
            id="login-email"
            type="email"
            className="field"
            autoComplete="email"
            placeholder="name@example.com"
            value={email}
            onChange={(e) => {
              setEmail(e.target.value);
              setError('');
            }}
          />
        </Field>

        <Field label="Password" htmlFor="login-password" hint={isRegister ? 'At least 8 characters with upper and lower case letters and a number.' : undefined}>
          <div className="relative">
            <input
              id="login-password"
              type={show ? 'text' : 'password'}
              className="field !pr-16"
              autoComplete={isRegister ? 'new-password' : 'current-password'}
              value={password}
              onChange={(e) => {
                setPassword(e.target.value);
                setError('');
              }}
            />
            <button type="button" className="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 text-xs font-semibold text-ink-500 hover:text-ink" onClick={() => setShow((v) => !v)} aria-pressed={show}>
              {show ? 'Hide' : 'Show'}
            </button>
          </div>
        </Field>

        {isRegister ? (
          <>
            <div aria-live="polite">
              <div className="flex gap-1" aria-hidden="true">
                {[1, 2, 3, 4].map((i) => (
                  <span key={i} className={`h-1.5 flex-1 ${strength >= i ? STRENGTH_COLOR[strength] : 'bg-steel-200'}`} />
                ))}
              </div>
              <p className="mt-1 text-xs text-ink-500">{password ? `Password strength: ${STRENGTH_LABEL[strength]}` : ' '}</p>
            </div>
            <Field label="Confirm password" htmlFor="login-confirm">
              <input id="login-confirm" type={show ? 'text' : 'password'} className="field" autoComplete="new-password" value={confirm} onChange={(e) => setConfirm(e.target.value)} />
            </Field>
          </>
        ) : null}

        {error ? (
          <p className="text-sm font-medium text-bad" role="alert">
            {error}
          </p>
        ) : null}

        <button type="submit" className="btn-dark w-full" disabled={busy}>
          {busy ? 'Checking…' : isRegister ? 'Create account' : 'Sign in'}
        </button>
        <p className="text-xs text-ink-500">
          Passwords are stored only as salted hashes. After 5 wrong attempts sign-in locks for 5 minutes, and you are signed out automatically after 8 hours.
        </p>
      </form>
    </div>
  );
}

/* ---------------- Shipping, couriers and GST ---------------- */

interface CourierDraft {
  id: string;
  name: string;
  charge: string;
  eta: string;
  enabled: boolean;
}

function AdminShipping() {
  const { settings, saveSettings } = useApp();
  const [gst, setGst] = useState(String(settings.gstRate));
  const [freeAbove, setFreeAbove] = useState(String(settings.freeShippingAbove));
  const [rows, setRows] = useState<CourierDraft[]>(
    settings.couriers.map((c) => ({ id: c.id, name: c.name, charge: String(c.charge), eta: c.eta, enabled: c.enabled })),
  );
  const [errors, setErrors] = useState<Record<string, string>>({});

  const patch = (id: string, p: Partial<CourierDraft>) => setRows((r) => r.map((x) => (x.id === id ? { ...x, ...p } : x)));

  const save = (e: FormEvent) => {
    e.preventDefault();
    const err: Record<string, string> = {};
    const gstN = Number(gst);
    const freeN = Number(freeAbove);
    if (!Number.isFinite(gstN) || gstN < 0 || gstN > 100) err.gst = 'Enter a GST rate between 0 and 100.';
    if (!Number.isFinite(freeN) || freeN < 0) err.free = 'Enter an amount, or 0 to turn free shipping off.';
    rows.forEach((r) => {
      if (r.name.trim().length < 2) err[`name-${r.id}`] = 'Enter a courier name.';
      const c = Number(r.charge);
      if (r.charge.trim() === '' || !Number.isFinite(c) || c < 0) err[`charge-${r.id}`] = 'Enter a charge, 0 or more.';
    });
    setErrors(err);
    if (Object.keys(err).length > 0) return;
    saveSettings({
      ...settings,
      gstRate: gstN,
      freeShippingAbove: freeN,
      couriers: rows.map((r) => ({ id: r.id, name: r.name.trim(), charge: Number(r.charge), eta: r.eta.trim(), enabled: r.enabled })),
    });
  };

  return (
    <form className="space-y-6" onSubmit={save} noValidate>
      <section className="panel space-y-4 p-5">
        <h2 className="text-2xl font-semibold">Tax and free shipping</h2>
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="GST rate (%)" htmlFor="sh-gst" error={errors.gst} hint="Added on top of product prices at checkout.">
            <input id="sh-gst" className="field" inputMode="decimal" value={gst} onChange={(e) => setGst(e.target.value)} />
          </Field>
          <Field label="Free shipping above (₹)" htmlFor="sh-free" error={errors.free} hint="Applies to the subtotal after coupon, before GST. Use 0 to switch off.">
            <input id="sh-free" className="field" inputMode="decimal" value={freeAbove} onChange={(e) => setFreeAbove(e.target.value)} />
          </Field>
        </div>
      </section>

      <section className="panel p-5">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="text-2xl font-semibold">Couriers and delivery charges</h2>
            <p className="text-sm text-ink-700">Customers choose one of the enabled options at checkout.</p>
          </div>
          <button
            type="button"
            className="btn-ghost"
            onClick={() => setRows((r) => [...r, { id: uid('c'), name: '', charge: '0', eta: '', enabled: true }])}
          >
            <Icon name="plus" className="h-4 w-4" /> Add courier
          </button>
        </div>

        <ul className="mt-4 space-y-3">
          {rows.map((r) => (
            <li key={r.id} className="grid gap-3 border border-steel-200 p-3 md:grid-cols-[1.4fr_8rem_1fr_auto]">
              <Field label="Courier name" htmlFor={`cr-name-${r.id}`} error={errors[`name-${r.id}`]}>
                <input id={`cr-name-${r.id}`} className="field" value={r.name} onChange={(e) => patch(r.id, { name: e.target.value })} />
              </Field>
              <Field label="Charge (₹)" htmlFor={`cr-charge-${r.id}`} error={errors[`charge-${r.id}`]}>
                <input id={`cr-charge-${r.id}`} className="field" inputMode="decimal" value={r.charge} onChange={(e) => patch(r.id, { charge: e.target.value })} />
              </Field>
              <Field label="Delivery time" htmlFor={`cr-eta-${r.id}`}>
                <input id={`cr-eta-${r.id}`} className="field" placeholder="e.g. 2 to 3 days" value={r.eta} onChange={(e) => patch(r.id, { eta: e.target.value })} />
              </Field>
              <div className="flex items-end gap-4 pb-2">
                <label className="flex items-center gap-2 text-sm" htmlFor={`cr-on-${r.id}`}>
                  <input id={`cr-on-${r.id}`} type="checkbox" className="h-4 w-4 accent-[#B45309]" checked={r.enabled} onChange={(e) => patch(r.id, { enabled: e.target.checked })} />
                  Enabled
                </label>
                <button type="button" className="inline-flex items-center gap-1 text-sm font-semibold text-bad hover:underline" onClick={() => setRows((x) => x.filter((y) => y.id !== r.id))} aria-label={`Remove courier ${r.name || ''}`}>
                  <Icon name="trash" className="h-4 w-4" /> Remove
                </button>
              </div>
            </li>
          ))}
          {rows.length === 0 ? <li className="p-4 text-sm text-ink-500">No couriers. Orders will ship with no delivery charge.</li> : null}
        </ul>
      </section>

      <div className="flex justify-end">
        <button type="submit" className="btn-primary">
          Save shipping and tax
        </button>
      </div>
    </form>
  );
}

function AdminPayments() {
  const { settings, saveSettings } = useApp();

  const [errors, setErrors] = useState<Record<string, string>>({});

/* ---------------- Coupons ---------------- */

interface CouponDraft {
  id: string;
  code: string;
  description: string;
  type: CouponType;
  value: string;
  minOrder: string;
  maxDiscount: string;
  expiresAt: string;
  active: boolean;
}

const blankCoupon = (): CouponDraft => ({
  id: uid('cp'),
  code: '',
  description: '',
  type: 'percent',
  value: '',
  minOrder: '0',
  maxDiscount: '0',
  expiresAt: '',
  active: true,
});

const draftFromCoupon = (c: Coupon): CouponDraft => ({
  id: c.id,
  code: c.code,
  description: c.description,
  type: c.type,
  value: String(c.value),
  minOrder: String(c.minOrder),
  maxDiscount: String(c.maxDiscount),
  expiresAt: c.expiresAt,
  active: c.active,
});

function CouponForm({ initial, isNew, onClose }: { initial: CouponDraft; isNew: boolean; onClose: () => void }) {
  const { settings, saveSettings } = useApp();
  const [d, setD] = useState<CouponDraft>(initial);
  const [errors, setErrors] = useState<Record<string, string>>({});
  const set = (k: keyof CouponDraft, v: string | boolean) => setD((x) => ({ ...x, [k]: v }));

  const submit = (e: FormEvent) => {
    e.preventDefault();
    const err: Record<string, string> = {};
    const code = d.code.trim().toUpperCase().replace(/\s+/g, '');
    const value = Number(d.value);
    const minOrder = Number(d.minOrder || 0);
    const maxDiscount = Number(d.maxDiscount || 0);
    if (code.length < 3) err.code = 'Use a code of at least 3 characters, e.g. SAVE10.';
    else if (settings.coupons.some((c) => c.id !== d.id && c.code.toUpperCase() === code)) err.code = 'This code already exists.';
    if (!Number.isFinite(value) || value <= 0) err.value = 'Enter a discount above 0.';
    else if (d.type === 'percent' && value > 100) err.value = 'A percentage cannot be above 100.';
    if (!Number.isFinite(minOrder) || minOrder < 0) err.minOrder = 'Enter 0 or more.';
    if (!Number.isFinite(maxDiscount) || maxDiscount < 0) err.maxDiscount = 'Enter 0 or more.';
    setErrors(err);
    if (Object.keys(err).length > 0) return;

    const coupon: Coupon = {
      id: d.id,
      code,
      description: d.description.trim(),
      type: d.type,
      value,
      minOrder,
      maxDiscount: d.type === 'percent' ? maxDiscount : 0,
      expiresAt: d.expiresAt,
      active: d.active,
    };
    const exists = settings.coupons.some((c) => c.id === coupon.id);
    const coupons = exists ? settings.coupons.map((c) => (c.id === coupon.id ? coupon : c)) : [coupon, ...settings.coupons];
    if (saveSettings({ ...settings, coupons })) onClose();
  };

  return (
    <Modal title={isNew ? 'Add coupon' : 'Edit coupon'} onClose={onClose}>
      <form className="space-y-4" onSubmit={submit} noValidate>
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Coupon code" htmlFor="cp-code" error={errors.code}>
            <input id="cp-code" className="field font-mono uppercase" value={d.code} onChange={(e) => set('code', e.target.value)} />
          </Field>
          <Field label="Discount type" htmlFor="cp-type">
            <select id="cp-type" className="field" value={d.type} onChange={(e) => set('type', e.target.value)}>
              <option value="percent">Percentage off</option>
              <option value="flat">Flat amount off (₹)</option>
            </select>
          </Field>
          <Field label={d.type === 'percent' ? 'Percent off (%)' : 'Amount off (₹)'} htmlFor="cp-value" error={errors.value}>
            <input id="cp-value" className="field" inputMode="decimal" value={d.value} onChange={(e) => set('value', e.target.value)} />
          </Field>
          <Field label="Minimum order (₹)" htmlFor="cp-min" error={errors.minOrder} hint="Subtotal before GST. 0 = no minimum.">
            <input id="cp-min" className="field" inputMode="decimal" value={d.minOrder} onChange={(e) => set('minOrder', e.target.value)} />
          </Field>
          {d.type === 'percent' ? (
            <Field label="Maximum discount (₹)" htmlFor="cp-max" error={errors.maxDiscount} hint="0 = no cap.">
              <input id="cp-max" className="field" inputMode="decimal" value={d.maxDiscount} onChange={(e) => set('maxDiscount', e.target.value)} />
            </Field>
          ) : null}
          <Field label="Expires on (optional)" htmlFor="cp-exp">
            <input id="cp-exp" type="date" className="field" value={d.expiresAt} onChange={(e) => set('expiresAt', e.target.value)} />
          </Field>
        </div>
        <Field label="Description (for your reference)" htmlFor="cp-desc">
          <input id="cp-desc" className="field" value={d.description} onChange={(e) => set('description', e.target.value)} />
        </Field>
        <label className="flex items-center gap-2 text-sm" htmlFor="cp-active">
          <input id="cp-active" type="checkbox" className="h-4 w-4 accent-[#B45309]" checked={d.active} onChange={(e) => set('active', e.target.checked)} />
          Active (customers can use it)
        </label>
        <div className="flex justify-end gap-2 border-t border-steel-200 pt-4">
          <button type="button" className="btn-ghost" onClick={onClose}>
            Cancel
          </button>
          <button type="submit" className="btn-primary">
            Save coupon
          </button>
        </div>
      </form>
    </Modal>
  );
}

                    </button>
                    <button type="button" className="inline-flex items-center gap-1 text-sm font-semibold hover:underline" onClick={() => setEditing({ draft: draftFromCoupon(c), isNew: false })} aria-label={`Edit coupon ${c.code}`}>
                      <Icon name="edit" className="h-4 w-4" /> Edit
                    </button>
                    <ConfirmDelete name={`coupon ${c.code}`} onConfirm={() => update(settings.coupons.filter((x) => x.id !== c.id))} />
                  </div>
                </td>
              </tr>
            ))}
            {settings.coupons.length === 0 ? (
              <tr>
                <td colSpan={5} className="px-4 py-8 text-center text-ink-500">
                  No coupons yet. Add one to offer a discount code at checkout.
                </td>
              </tr>
            ) : null}
          </tbody>
        </table>
      </div>

      {editing ? <CouponForm initial={editing.draft} isNew={editing.isNew} onClose={() => setEditing(null)} /> : null}
    </div>
  );
}

function AdminOverview() {
  const { products, orders, enquiries, services, resetAll } = useApp();
  const [confirmReset, setConfirmReset] = useState(false);
  const revenue = orders.filter((o) => o.status !== 'Cancelled').reduce((s, o) => s + o.total, 0);
  const lowStock = products.filter((p) => p.stock <= 5 || !isAvailable(p)).sort((a, b) => a.stock - b.stock);

  const tiles = [

  return (

      <dl className="grid grid-cols-2 gap-4 lg:grid-cols-4">

      <section className="panel">
        <h2 className="border-b border-steel-200 px-5 py-3 text-2xl font-semibold">Low or out of stock</h2>
        {lowStock.length === 0 ? (
          <p className="p-5 text-sm text-ink-500">Every product is in stock with more than 5 units.</p>
        ) : (
          <ul className="divide-y divide-steel-200">
            {lowStock.map((p) => (
              <li key={p.id} className="flex items-center justify-between gap-4 px-5 py-3 text-sm">
                <span className="min-w-0 truncate">{p.name}</span>
                <span className={`shrink-0 font-mono font-semibold ${!isAvailable(p) ? 'text-bad' : 'text-forge-dark'}`}>{!isAvailable(p) ? 'Out of stock' : `${p.stock} left`}</span>
              </li>

      <section className="panel p-5">
        <h2 className="text-2xl font-semibold">Data</h2>

          enquiries.
        </p>

          <div className="mt-3 flex flex-wrap items-center gap-2">

interface ProductDraft {
  id: string;
  sku: string;
  name: string;
  category: string;
  brand: string;
  price: string;
  mrp: string;
  stock: string;
  unit: string;
  description: string;
  specs: string;
  featured: boolean;
  image: string;
  inStock: boolean;
  hidden: boolean;
}

const blankProduct = (): ProductDraft => ({
  id: uid('p'),
  sku: '',
  name: '',
  category: '',
  brand: 'Vel',
  price: '',
  mrp: '',
  stock: '0',
  unit: 'piece',
  description: '',
  specs: '',
  featured: false,
  image: '',
  inStock: true,
  hidden: false,
});

const draftFromProduct = (p: Product): ProductDraft => ({
  id: p.id,
  sku: p.sku,
  name: p.name,
  category: p.category,
  brand: p.brand,
  price: String(p.price),
  mrp: String(p.mrp),
  stock: String(p.stock),
  unit: p.unit,
  description: p.description,
  specs: specsToText(p.specs),
  featured: p.featured,
  image: p.image ?? '',
  inStock: p.available !== false,
  hidden: Boolean(p.hidden),
});

function ProductForm({ initial, isNew, onClose }: { initial: ProductDraft; isNew: boolean; onClose: () => void }) {
  const { products, saveProduct } = useApp();
  const [d, setD] = useState<ProductDraft>(initial);
  const [errors, setErrors] = useState<Record<string, string>>({});
  const categories = Array.from(new Set(products.map((p) => p.category)));

  const set = (k: keyof ProductDraft, v: string | boolean) => setD((x) => ({ ...x, [k]: v }));

  const submit = (e: FormEvent) => {
    e.preventDefault();
    const err: Record<string, string> = {};
    const price = Number(d.price);
    const mrp = d.mrp.trim() === '' ? price : Number(d.mrp);
    const stock = Number(d.stock);
    if (d.name.trim().length < 3) err.name = 'Enter a product name.';
    if (d.sku.trim().length < 2) err.sku = 'Enter a SKU.';
    else if (products.some((p) => p.id !== d.id && p.sku.toLowerCase() === d.sku.trim().toLowerCase())) err.sku = 'This SKU already exists.';
    if (d.category.trim().length < 2) err.category = 'Enter a category.';
    if (!Number.isFinite(price) || price <= 0) err.price = 'Enter a price above 0.';
    if (!Number.isFinite(mrp) || mrp < price) err.mrp = 'MRP must be at least the selling price.';
    if (!Number.isInteger(stock) || stock < 0) err.stock = 'Enter a whole number, 0 or more.';
    setErrors(err);
    if (Object.keys(err).length > 0) return;

    const product: Product = {
      id: d.id,
      sku: d.sku.trim(),
      name: d.name.trim(),
      category: d.category.trim(),
      brand: d.brand.trim() || 'Vel',
      price,
      mrp,
      stock,
      unit: d.unit.trim() || 'piece',
      description: d.description.trim(),
      specs: parseSpecs(d.specs),
      featured: d.featured,
      image: d.image,
      available: d.inStock,
      hidden: d.hidden,
    };
    if (saveProduct(product)) onClose();
  };

  return (
    <Modal title={isNew ? 'Add product' : 'Edit product'} onClose={onClose} wide>
      <form className="space-y-4" onSubmit={submit} noValidate>
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Name" htmlFor="pf-name" error={errors.name}>
            <input id="pf-name" className="field" value={d.name} onChange={(e) => set('name', e.target.value)} />
          </Field>
          <Field label="SKU" htmlFor="pf-sku" error={errors.sku}>
            <input id="pf-sku" className="field font-mono" value={d.sku} onChange={(e) => set('sku', e.target.value)} />
          </Field>
          <Field label="Category" htmlFor="pf-cat" error={errors.category}>
            <input id="pf-cat" className="field" list="pf-cats" value={d.category} onChange={(e) => set('category', e.target.value)} />
            <datalist id="pf-cats">
              {categories.map((c) => (
                <option key={c} value={c} />
              ))}
            </datalist>
          </Field>
          <Field label="Brand" htmlFor="pf-brand">
            <input id="pf-brand" className="field" value={d.brand} onChange={(e) => set('brand', e.target.value)} />
          </Field>
          <Field label="Price (₹, excl. GST)" htmlFor="pf-price" error={errors.price}>
            <input id="pf-price" className="field" inputMode="decimal" value={d.price} onChange={(e) => set('price', e.target.value)} />
          </Field>
          <Field label="MRP (₹)" htmlFor="pf-mrp" error={errors.mrp} hint="Leave blank to match the price.">
            <input id="pf-mrp" className="field" inputMode="decimal" value={d.mrp} onChange={(e) => set('mrp', e.target.value)} />
          </Field>
          <Field label="Quantity in stock" htmlFor="pf-stock" error={errors.stock}>
            <input id="pf-stock" className="field" inputMode="numeric" value={d.stock} onChange={(e) => set('stock', e.target.value)} />
          </Field>
          <Field label="Unit" htmlFor="pf-unit">
            <input id="pf-unit" className="field" value={d.unit} onChange={(e) => set('unit', e.target.value)} />
          </Field>
          <Field label="Stock status" htmlFor="pf-status" hint="Out of stock disables buying even if a quantity is set.">
            <select id="pf-status" className="field" value={d.inStock ? 'in' : 'out'} onChange={(e) => set('inStock', e.target.value === 'in')}>
              <option value="in">In stock</option>
              <option value="out">Out of stock</option>
            </select>
          </Field>
        </div>
        <ImagePicker
          id="pf-image"
          label="Product image"
          value={d.image}
          onChange={(v) => set('image', v)}
          maxDim={800}
          mime="image/jpeg"
          hint="Resized automatically to keep the site fast. Use a clear photo on a plain background."
        />
        <Field label="Description" htmlFor="pf-desc">
          <textarea id="pf-desc" rows={3} className="field" value={d.description} onChange={(e) => set('description', e.target.value)} />
        </Field>
        <Field label="Specifications" htmlFor="pf-specs" hint='One per line, written as "Label: value".'>
          <textarea id="pf-specs" rows={5} className="field font-mono" value={d.specs} onChange={(e) => set('specs', e.target.value)} />
        </Field>
        <div className="space-y-2">
          <label className="flex items-center gap-2 text-sm" htmlFor="pf-featured">
            <input id="pf-featured" type="checkbox" className="h-4 w-4 accent-[#B45309]" checked={d.featured} onChange={(e) => set('featured', e.target.checked)} />
            Show on the homepage as a featured product
          </label>
          <label className="flex items-center gap-2 text-sm" htmlFor="pf-hidden">
            <input id="pf-hidden" type="checkbox" className="h-4 w-4 accent-[#B45309]" checked={d.hidden} onChange={(e) => set('hidden', e.target.checked)} />
            Hide this product from the public store
          </label>
        </div>
        <div className="flex justify-end gap-2 border-t border-steel-200 pt-4">
          <button type="button" className="btn-ghost" onClick={onClose}>
            Cancel
          </button>
          <button type="submit" className="btn-primary">
            Save product
          </button>
        </div>
      </form>
    </Modal>
  );
}

interface ServiceDraft {

function ServiceForm({ initial, isNew, onClose }: { initial: ServiceDraft; isNew: boolean; onClose: () => void }) {
  const { saveService } = useApp();
  const [d, setD] = useState<ServiceDraft>(initial);
  const [errors, setErrors] = useState<Record<string, string>>({});
  const set = (k: keyof ServiceDraft, v: string) => setD((x) => ({ ...x, [k]: v }));

  const submit = (e: FormEvent) => {
    e.preventDefault();
    const err: Record<string, string> = {};
    const price = Number(d.priceFrom);
    if (d.name.trim().length < 3) err.name = 'Enter a service name.';
    if (d.description.trim().length < 10) err.description = 'Add a short description.';
    if (!Number.isFinite(price) || price < 0) err.priceFrom = 'Enter a starting price, 0 or more.';
    setErrors(err);
    if (Object.keys(err).length > 0) return;
    const service: Service = {
      id: d.id,
      name: d.name.trim(),
      description: d.description.trim(),
      priceFrom: price,
      turnaround: d.turnaround.trim(),
      coverage: d.coverage.split(',').map((c) => c.trim()).filter(Boolean),
    };
    if (saveService(service)) onClose();
  };

  return (
    <Modal title={isNew ? 'Add service' : 'Edit service'} onClose={onClose}>
      <form className="space-y-4" onSubmit={submit} noValidate>
        <Field label="Service name" htmlFor="sf-name" error={errors.name}>

          <Field label="Starting price (₹)" htmlFor="sf-price" error={errors.priceFrom}>

            <input id="sf-turn" className="field" value={d.turnaround} onChange={(e) => set('turnaround', e.target.value)} />

    saveCompany(next);
  };

  return (

  const [tab, setTab] = useState<Tab>('overview');
  const newEnq = enquiries.filter((e) => e.status === 'New').length;
  const openOrders = orders.filter((o) => o.status === 'Placed').length;

  return (
    <>
      <PageHeader eyebrow="Management Dashboard" title="Run the group" lead={`Signed in as ${session?.email ?? ''}. Changes save instantly and appear on the public pages.`} />
      <div className="wrap mt-6">
        <div role="tablist" aria-label="Dashboard sections" className="flex gap-1 overflow-x-auto border-b border-steel-200">
          {TABS.map((t) => {
            const count = t.id === 'enquiries' ? newEnq : t.id === 'orders' ? openOrders : 0;
            return (
              <button
                key={t.id}

                type="button"

                aria-selected={tab === t.id}

                onClick={() => setTab(t.id)}
                className={`-mb-px shrink-0 border-b-2 px-4 py-2.5 text-sm font-semibold ${

              </button>
            );
          })}
        </div>
        <div id="admin-panel" role="tabpanel" aria-labelledby={`tab-${tab}`} className="mt-6">
          {tab === 'overview' ? <AdminOverview /> : null}
          {tab === 'products' ? <AdminProducts /> : null}

          {tab === 'company' ? <AdminCompany /> : null}
          {tab === 'branding' ? <AdminBranding /> : null}
          {tab === 'shipping' ? <AdminShipping /> : null}

      </div>
    </>
  );
}

// ---- src/App.tsx ----

function Page({ route }: { route: RouteId }) {
  const { role } = useApp();

  // The Management Dashboard is invisible to everyone except the owner's admin account:
  // other visitors are sent to the homepage with no hint that the page exists.
  if (route === 'admin' && role !== 'admin') return <Home />;

  // Role-based access control for the remaining routes (e.g. checkout needs a signed-in user).
  if (!ROUTE_ACCESS[route].includes(role)) {
    return <Login reason="Sign in with your Gmail account to complete your purchase." inPlace />;
  }

  switch (route) {
    case 'home':
      return <Home />;
    case 'service-center':
      return <ServiceCenter />;
    case 'store':
      return <Store />;
    case 'manufacturing':
      return <Manufacturing />;
    case 'service-enquiry':
      return <ServiceEnquiry />;
    case 'cart':
      return <Cart />;
    case 'checkout':
      return <Checkout />;
    case 'login':
      return <Login inPlace={false} />;
    case 'admin':
      return <Admin />;
    default:
      return <Home />;
  }
}

function Shell() {
  const route = useRoute();
  const { company, role } = useApp();

  useEffect(() => {
    document.title = company.name;
  }, [company.name]);

  // Non-admins who open #admin are redirected home, including when the hash changes later.
  useEffect(() => {
    const guard = () => {
      if (window.location.hash === '#admin' && role !== 'admin') go('home');
    };
    guard();
    window.addEventListener('hashchange', guard);
    return () => window.removeEventListener('hashchange', guard);
  }, [role]);

  return (
    <div className="flex min-h-screen flex-col">
      <Header route={route} />
      <main className="flex-1">
        <Page route={route} />
      </main>
      <Footer />
      <Toasts />
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <Shell />
    </AppProvider>
  );
}
